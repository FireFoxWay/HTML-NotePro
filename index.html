<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NoteSwap — Study Notes Exchange Platform</title>

<style>
body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}
header{padding:14px 18px;background:#11173a;font-weight:800}
section{padding:16px}
input,textarea,button,select{
  width:100%;margin:6px 0;padding:10px;border-radius:8px;
  border:1px solid #333;background:#0e1538;color:#fff
}
button{cursor:pointer;background:#5b5bf7}
.card{background:#141b44;padding:12px;border-radius:10px;margin:8px 0}
.small{font-size:12px;opacity:.8}
.chat{height:260px;overflow:auto;background:#05081f;padding:10px;border-radius:8px}
img.chatImg{max-width:180px;border-radius:8px;margin-top:6px}
</style>
</head>

<body>

<header>📘 NoteSwap — Study Notes Exchange</header>

<section>
<h3>👤 Your Name</h3>
<input id="userName" placeholder="Enter your name"/>
<div class="small">Points: <b id="pointsBox">0</b></div>
</section>

<section>
<h3>📚 Share Study Notes</h3>
<select id="snSubject">
<option>Math</option><option>Science</option>
<option>Social</option><option>English</option>
<option>AI</option>
</select>
<input id="snTitle" placeholder="Topic"/>
<textarea id="snPoints" rows="4" placeholder="One point per line"></textarea>
<button onclick="shareNote()">Share Note (+points)</button>
</section>

<section>
<h3>🔁 Community Notes (Use 1 Point)</h3>
<div id="notesFeed"></div>
</section>

<section>
<h3>💬 Study Room Chat</h3>
<input id="room" placeholder="Room code (eg: math-9)"/>
<div class="chat" id="chatBox"></div>
<input id="chatText" placeholder="Message"/>
<input type="file" id="chatImage" accept="image/*"/>
<button onclick="sendChat()">Send</button>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy,
  onSnapshot, serverTimestamp, doc, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7AhWd_9tt33c2mvGBMMaFFzBFjxk8svc",
  authDomain: "notepro-3194d.firebaseapp.com",
  projectId: "notepro-3194d",
  storageBucket: "notepro-3194d.appspot.com",
  messagingSenderId: "748657045336",
  appId: "1:748657045336:web:1a10be8e3aec289933ff2d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// ---- POINTS ----
let points = Number(localStorage.getItem("points") || 0);
document.getElementById("pointsBox").textContent = points;

// ---- NOTES (Partition: notes) ----
const notesRef = collection(db, "notes");

window.shareNote = async ()=>{
  const subject = snSubject.value;
  const title = snTitle.value;
  const raw = snPoints.value.trim();
  const author = userName.value || "Anonymous";
  if(!raw) return alert("Write points");

  const pts = raw.split("\n").filter(Boolean);
  await addDoc(notesRef,{
    subject,title,points:pts,author,
    createdAt:serverTimestamp(),
    downloads:0
  });

  points += pts.length;
  localStorage.setItem("points",points);
  pointsBox.textContent = points;

  snTitle.value=""; snPoints.value="";
};

onSnapshot(query(notesRef,orderBy("createdAt","desc")),snap=>{
  notesFeed.innerHTML="";
  snap.forEach(d=>{
    const n=d.data();
    notesFeed.innerHTML+=`
      <div class="card">
        <b>${n.subject} • ${n.title}</b><br/>
        <span class="small">By ${n.author}</span>
        <ul>${n.points.map(p=>`<li>${p}</li>`).join("")}</ul>
        <button onclick="useNote('${d.id}')">Use Note (−1)</button>
      </div>`;
  });
});

window.useNote = async(id)=>{
  if(points<=0) return alert("No points");
  points--; localStorage.setItem("points",points);
  pointsBox.textContent=points;
  await updateDoc(doc(db,"notes",id),{downloads:increment(1)});
};

// ---- CHAT (Partition: rooms/{room}/messages) ----
let unsub=null;

room.onchange=()=>{
  if(unsub)unsub();
  chatBox.innerHTML="";
  const msgs=collection(db,"rooms",room.value,"messages");
  unsub=onSnapshot(query(msgs,orderBy("createdAt")),snap=>{
    chatBox.innerHTML="";
    snap.forEach(d=>{
      const m=d.data();
      chatBox.innerHTML+=`
        <div>
          <b>${m.name}:</b> ${m.text||""}
          ${m.image?`<br/><img class="chatImg" src="${m.image}"/>`:""}
        </div>`;
    });
    chatBox.scrollTop=chatBox.scrollHeight;
  });
};

window.sendChat = async()=>{
  if(!room.value)return alert("Enter room");
  const name=userName.value||"Anon";
  let imgUrl=null;

  if(chatImage.files[0]){
    const f=chatImage.files[0];
    const r=ref(storage,"chat/"+Date.now()+"_"+f.name);
    await uploadBytes(r,f);
    imgUrl=await getDownloadURL(r);
  }

  await addDoc(collection(db,"rooms",room.value,"messages"),{
    name,text:chatText.value,image:imgUrl,
    createdAt:serverTimestamp()
  });

  chatText.value=""; chatImage.value="";
};
</script>

</body>
</html>
